<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>素材工具台</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css?v=tool-order-1" />
    <script src="./app.js?v=tool-order-1" defer></script>
  </head>
  <body>
    <div class="merged-shell">
      <aside class="tool-sidebar" aria-label="素材工具台">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M7 9h9.5c4.7 0 8.5 3.8 8.5 8.5S21.2 26 16.5 26H7V9Z" />
              <path d="M10.5 13.2h6.2a3 3 0 1 1 0 6h-6.2v-6Z" />
              <path d="M21.8 6.2 25.5 3l3.3 3.7-3.6 3.2-3.4-3.7Z" />
            </svg>
          </div>
          <div>
            <h1>素材工具台</h1>
            <p id="toolStatus">一键抠图</p>
          </div>
        </div>

        <div class="tool-order-bar">
          <span class="tool-order-hint">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="8" cy="6" r="1" />
              <circle cx="16" cy="6" r="1" />
              <circle cx="8" cy="12" r="1" />
              <circle cx="16" cy="12" r="1" />
              <circle cx="8" cy="18" r="1" />
              <circle cx="16" cy="18" r="1" />
            </svg>
            <span>拖动排序</span>
          </span>
          <button id="resetToolOrder" type="button" title="恢复默认排序" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h11a5 5 0 0 1 0 10H9" />
              <path d="m8 3-4 4 4 4" />
            </svg>
            <span>恢复默认</span>
          </button>
        </div>

        <nav class="tool-tabs" aria-label="工具切换">
          <button class="tool-tab is-active" type="button" data-tool="vector">
            <span class="tab-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M4 5h6v6H4z" />
                <path d="M14 13h6v6h-6z" />
                <path d="M10 8c4.6.4 7.4 2.8 8 7" />
              </svg>
            </span>
            <span class="tab-copy">
              <span class="tab-title">一键抠图</span>
              <span class="tab-subtitle">抠图 / 分离 / 导出</span>
            </span>
          </button>
          <button class="tool-tab" type="button" data-tool="extractor">
            <span class="tab-icon extractor-tab-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M4 5h16v14H4z" />
                <path d="m8 13 3 3 5-6 4 5" />
                <path d="M8 9h.01" />
                <path d="M12 21v-5" />
                <path d="m9.5 18.5 2.5 2.5 2.5-2.5" />
              </svg>
            </span>
            <span class="tab-copy">
              <span class="tab-title">构建包素材提取</span>
              <span class="tab-subtitle">UI 图片 / 音频 / 批量下载</span>
            </span>
          </button>
          <button class="tool-tab" type="button" data-tool="green-screen">
            <span class="tab-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <rect x="4" y="4" width="16" height="16" rx="2" />
                <path d="M8 4v16M16 4v16M4 9h16M4 15h16" />
              </svg>
            </span>
            <span class="tab-copy">
              <span class="tab-title">绿幕视频转序列帧</span>
              <span class="tab-subtitle">任意纯色背景 / 透明 PNG 序列</span>
            </span>
          </button>
          <button class="tool-tab" type="button" data-tool="gif">
            <span class="tab-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M4 6h16" />
                <path d="M4 12h16" />
                <path d="M4 18h16" />
              </svg>
            </span>
            <span class="tab-copy">
              <span class="tab-title">序列帧压缩</span>
              <span class="tab-subtitle">GIF / MP4 / PNG 转 Cocos</span>
            </span>
          </button>
          <button class="tool-tab" type="button" data-tool="cocos">
            <span class="tab-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 4h10l4 4v12H5z" />
                <path d="M15 4v5h5" />
                <path d="m9 14 2 2 4-4" />
              </svg>
            </span>
            <span class="tab-copy">
              <span class="tab-title">Cocos HTML 压缩</span>
              <span class="tab-subtitle">拖入 HTML / 输出 5MB 包</span>
            </span>
          </button>
          <button class="tool-tab" type="button" data-tool="model">
            <span class="tab-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z" />
                <path d="m4.4 7.7 7.6 4.4 7.6-4.4M12 12.1V21" />
              </svg>
            </span>
            <span class="tab-copy">
              <span class="tab-title">FBX / GLB 模型压缩</span>
              <span class="tab-subtitle">适配 Cocos 3.8.3 / 减面 / 贴图</span>
            </span>
          </button>
          <button class="tool-tab" type="button" data-tool="vfx">
            <span class="tab-icon vfx-tab-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="m12 2-1.2 6.8L6 4l3.1 6.1L2 12l7.1 1.9L6 20l4.8-4.8L12 22l1.2-6.8L18 20l-3.1-6.1L22 12l-7.1-1.9L18 4l-4.8 4.8z" />
              </svg>
            </span>
            <span class="tab-copy">
              <span class="tab-title">特效贴图生成</span>
              <span class="tab-subtitle">参考图 / 透明 PNG 粒子</span>
            </span>
          </button>
        </nav>

        <p id="toolOrderStatus" class="sr-only" aria-live="polite"></p>

        <div class="sidebar-actions">
          <button id="reloadTool" class="utility-action" type="button" title="刷新当前工具" aria-label="刷新当前工具">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.3-5.7" />
              <path d="M20 4v6h-6" />
            </svg>
            <span>刷新</span>
          </button>
          <button id="openTool" class="utility-action" type="button" title="单独打开当前工具" aria-label="单独打开当前工具">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 8h8v8" />
              <path d="M7 17 16 8" />
              <path d="M5 5h14v14H5z" />
            </svg>
            <span>单独打开</span>
          </button>
        </div>
      </aside>

      <main class="tool-workspace">
        <header class="workspace-header">
          <div>
            <h2 id="toolHeading">一键抠图</h2>
            <p id="toolDescription">载入图片后自动抠图分离素材，支持 SVG、PNG 和批量导出。</p>
          </div>
          <div class="status-pill" aria-label="处理方式">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3 5 6v5c0 4.4 2.8 8.2 7 9.8 4.2-1.6 7-5.4 7-9.8V6z" />
              <path d="M9 12l2 2 4-4" />
            </svg>
            <span>本地处理</span>
          </div>
        </header>

        <section class="frame-stack" aria-live="polite">
          <iframe
            class="tool-frame is-active"
            data-tool="vector"
            title="一键抠图"
            data-src="./asset-vectorizer/index.html?v=matte-only-1"
          ></iframe>
          <iframe
            class="tool-frame"
            data-tool="extractor"
            title="构建包素材提取"
            data-src="./game-insight-parser/index.html?v=asset-download-1"
          ></iframe>
          <iframe
            class="tool-frame"
            data-tool="green-screen"
            title="绿幕视频转序列帧"
            data-src="./green-screen-to-frames/index.html?v=gif-input-1"
          ></iframe>
          <iframe
            class="tool-frame"
            data-tool="gif"
            title="序列帧压缩"
            data-src="./gif-to-cocos-tool/index.html?v=vfx-entry-1"
          ></iframe>
          <iframe
            class="tool-frame"
            data-tool="cocos"
            title="Cocos HTML 压缩"
            data-src="./cocos-html-compressor/index.html?v=channel-zip-6"
          ></iframe>
          <iframe
            class="tool-frame"
            data-tool="model"
            title="FBX / GLB 模型压缩"
            data-src="./glb-model-optimizer/index.html?mode=model&v=fbx-cocos383-1"
          ></iframe>
          <iframe
            class="tool-frame"
            data-tool="vfx"
            title="特效贴图生成"
            data-src="./glb-model-optimizer/index.html?mode=vfx&v=vfx-textures-3"
          ></iframe>
        </section>
      </main>
    </div>
  </body>
</html>

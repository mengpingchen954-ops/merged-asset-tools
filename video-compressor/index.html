<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>视频压缩</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css?v=1" />
  <script src="./vendor/ffmpeg.js" defer></script>
  <script src="../cocos-html-compressor/vendor/jszip.min.js" defer></script>
  <script type="module" src="./app.js?v=1"></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div><h1>视频压缩</h1><p>批量压缩为 MP4，保留原尺寸和帧率</p></div>
      <label class="file-button">选择视频<input id="fileInput" class="sr-only" type="file" accept="video/*,.mp4,.mov,.mkv,.webm,.avi,.m4v" multiple /></label>
    </header>
    <div class="workspace">
      <aside class="settings-panel" aria-label="压缩设置">
        <label id="dropZone" class="drop-zone" for="fileInput">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>
          <strong>拖入视频</strong><span>或点击选择，可一次添加多个</span><small>MP4 / MOV / WEBM / MKV / AVI</small>
        </label>
        <div class="settings">
          <label for="quality">压缩档位</label>
          <select id="quality"><option value="20">高清 · 保留更多细节</option><option value="23">均衡 · 推荐日常使用</option><option value="28">小体积 · 允许细节损失</option></select>
          <p id="qualityHelp">优先保留画质，适合动画、文字与细节较多的视频。</p>
          <label for="audio">音频</label>
          <select id="audio"><option value="keep">保留音频</option><option value="remove">移除音频</option></select>
        </div>
        <button id="compressButton" class="primary-action" type="button" disabled>压缩全部</button>
        <button id="cancelButton" type="button" hidden>停止压缩</button>
        <progress id="progress" max="100" value="0" aria-label="当前视频压缩进度" hidden></progress>
        <p id="status" role="status" aria-live="polite">选择视频后开始压缩。</p>
        <p class="help">视频在浏览器本地处理。首次压缩需下载约 31 MB 的处理引擎；高分辨率或长视频处理较慢，建议每个文件不超过 200 MB。</p>
        <p class="help">压缩为有损 H.264 MP4，原文件不会改变。已经压缩过的视频可能无法继续缩小；奇数宽高会补齐 1 像素。</p>
      </aside>
      <section class="results-panel" aria-label="压缩结果">
        <div class="results-head"><div><h2>视频列表</h2><p id="summary">还没有视频</p></div><div class="actions"><button id="clearButton" type="button" disabled>清空</button><button id="zipButton" type="button" disabled>下载全部 ZIP</button></div></div>
        <div class="table-wrap"><table><thead><tr><th scope="col">视频</th><th scope="col">原大小</th><th scope="col">压缩后</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead><tbody id="fileList"></tbody></table><p id="emptyState" class="empty-state">添加视频，在这里查看压缩前后的大小。</p></div>
        <section id="preview" class="preview" aria-label="视频对比预览" hidden>
          <h2 id="previewName">视频预览</h2>
          <div class="preview-grid"><figure><figcaption>原视频</figcaption><video id="sourceVideo" controls playsinline preload="metadata"></video><p id="sourceInfo"></p></figure><figure><figcaption>压缩后</figcaption><video id="resultVideo" controls playsinline preload="metadata" hidden></video><p id="resultInfo">压缩后可播放对比</p></figure></div>
          <p class="help">请播放压缩结果确认细节。预览若不支持源视频编码，仍可尝试压缩。</p>
        </section>
      </section>
    </div>
  </main>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>背景抠像序列帧</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css?v=crop-output-1" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 28 28">
              <path d="M5 8.5h11.8c3.5 0 6.2 2.7 6.2 6.1 0 3.5-2.7 6.2-6.2 6.2H5V8.5Z" />
              <path d="M9 12.4h7.3a2.2 2.2 0 1 1 0 4.4H9v-4.4Z" />
            </svg>
          </span>
          <div>
            <h1>背景抠像序列帧</h1>
            <p>本地透明 PNG 导出工具</p>
          </div>
        </div>
        <p id="headerStatus" class="header-status">拖入纯色背景 MP4 开始处理</p>
      </header>

      <section class="workspace" aria-live="polite">
        <section id="previewPanel" class="preview-panel" aria-label="透明预览">
          <label id="dropZone" class="drop-zone" for="videoInput">
            <input id="videoInput" type="file" accept="video/mp4,.mp4" />
            <span class="upload-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 15V4m0 0L8 8m4-4 4 4" />
                <path d="M5 15.5V20h14v-4.5" />
              </svg>
            </span>
            <strong>拖入纯色背景 MP4</strong>
            <span>或点击选择文件</span>
          </label>

          <div id="canvasWrap" class="canvas-wrap is-hidden">
            <div id="previewStage" class="preview-stage">
              <canvas id="previewCanvas" width="960" height="960" aria-label="抠像预览，点击画面可以取样背景色"></canvas>
              <div id="cropSelection" class="crop-selection is-hidden" aria-hidden="true"></div>
              <button id="sampleHint" class="sample-hint" type="button">点击画面取样背景色</button>
            </div>
          </div>
        </section>

        <aside class="inspector" aria-label="抠像参数">
          <section class="source-info">
            <span class="section-label">视频信息</span>
            <strong id="videoName">未选择视频</strong>
            <span id="videoMeta">MP4 视频将在此浏览器本地处理</span>
          </section>

          <section class="controls">
            <label class="control-row sample-row">
              <span>取样背景色</span>
              <button id="sampleButton" class="color-control" type="button" title="在预览画面中点击取样背景色">
                <i id="colorSwatch" aria-hidden="true"></i>
                <b id="colorHex">#00A94F</b>
              </button>
            </label>

            <label class="control-row">
              <span>背景阈值 <output id="thresholdValue" for="thresholdInput">28%</output></span>
              <input id="thresholdInput" type="range" min="0" max="100" value="28" />
            </label>

            <label class="control-row">
              <span>边缘柔化 <output id="softnessValue" for="softnessInput">8%</output></span>
              <input id="softnessInput" type="range" min="0" max="100" value="8" />
            </label>

            <label class="control-row">
              <span>去背景溢色 <output id="spillValue" for="spillInput">25%</output></span>
              <input id="spillInput" type="range" min="0" max="100" value="25" />
            </label>
          </section>

          <section class="playback">
            <label class="control-row">
              <span>预览位置 <output id="timeValue" for="timeInput">0.0s</output></span>
              <input id="timeInput" type="range" min="0" max="0" value="0" step="0.001" disabled />
            </label>
          </section>

          <section class="output-settings">
            <label>
              <span>输出帧率</span>
              <select id="frameRateInput">
                <option value="12" selected>12 fps</option>
                <option value="15">15 fps</option>
                <option value="24">24 fps</option>
                <option value="30">30 fps</option>
              </select>
            </label>
            <div class="source-size">
              <span>原尺寸</span>
              <strong id="originalSize">-- x -- px</strong>
            </div>
            <div class="dimension-fields">
              <label>
                <span>输出宽度</span>
                <input id="outputWidthInput" type="number" min="1" max="8192" step="1" inputmode="numeric" disabled />
              </label>
              <label>
                <span>输出高度</span>
                <input id="outputHeightInput" type="number" min="1" max="8192" step="1" inputmode="numeric" disabled />
              </label>
            </div>
            <div class="crop-controls">
              <div>
                <span>裁剪区域</span>
                <p id="cropMeta">完整画面</p>
              </div>
              <div class="crop-actions" role="group" aria-label="裁剪工具">
                <button id="cropModeButton" class="tool-icon-button" type="button" aria-label="框选裁剪" title="框选裁剪" aria-pressed="false" disabled>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 4H5a1 1 0 0 0-1 1v3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3" />
                    <path d="M8 8h8v8H8z" />
                  </svg>
                </button>
                <button id="resetCropButton" class="tool-icon-button" type="button" aria-label="重置裁剪" title="重置裁剪" disabled>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 12a8 8 0 1 1-2.3-5.7" />
                    <path d="M20 4v6h-6" />
                  </svg>
                </button>
              </div>
            </div>
          </section>

          <button id="exportButton" class="export-button" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5" />
              <path d="M5 20h14" />
            </svg>
            <span id="exportLabel">导出并保存透明 PNG 序列</span>
          </button>
          <a id="downloadLink" class="export-button download-link is-hidden" download>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5" />
              <path d="M5 20h14" />
            </svg>
            <span>重新下载透明 PNG 序列 ZIP</span>
          </a>

          <div class="progress-block">
            <div class="progress-track"><span id="progressBar"></span></div>
            <p id="exportStatus">导出后将下载 PNG 序列 ZIP</p>
          </div>

          <p class="help-text">视频不会上传。建议先在预览中点击背景区域取样并微调参数，确认边缘干净后再导出。</p>
        </aside>
      </section>
    </main>

    <video id="sourceVideo" class="source-video" muted playsinline preload="metadata"></video>
    <canvas id="sourceCanvas" class="offscreen" aria-hidden="true"></canvas>
    <script src="../cocos-html-compressor/vendor/jszip.min.js"></script>
    <script src="./app.js?v=crop-output-3"></script>
  </body>
</html>
